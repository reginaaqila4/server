; PHP Upload Configuration for Nextcloud
upload_max_filesize = 10G
post_max_size = 10G
memory_limit = 1G
max_execution_time = 3600
max_input_time = 3600
max_input_vars = 3000

; File handling
file_uploads = On
max_file_uploads = 100

; Session
session.gc_maxlifetime = 3600
session.cookie_lifetime = 3600